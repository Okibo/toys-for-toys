<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post-Exchange Feedback</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#2bee6c",
                    "background-light": "#f6f8f6",
                    "background-dark": "#102216",
                },
                fontFamily: {
                    "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
                },
                borderRadius: {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
                },
            },
        },
    }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111813] dark:text-white">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 sm:px-10 md:px-20 lg:px-40 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1">
<!-- PageHeading -->
<div class="flex flex-wrap justify-between gap-3 p-4">
<div class="flex min-w-72 flex-col gap-3">
<h1 class="text-[#111813] dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">How was the exchange with Anna?</h1>
<p class="text-[#61896f] dark:text-gray-300 text-base font-normal leading-normal">Your feedback helps build a trusted community.</p>
</div>
</div>
<!-- ListItem (User Profile Snippet) -->
<div class="border-y border-[#dbe6df] dark:border-gray-700">
<div class="flex items-center gap-4 bg-transparent px-4 min-h-14 justify-between">
<div class="flex items-center gap-4">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-10 w-10" data-alt="Profile picture of Anna K." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBixdHrsy_dpWQDwycjeZ9_skXRoZs_xIVIBum9m5VRVeX3e0iAn9hvnpU2SYt_IMS_87hpQRP8PVO_PMb9QoyRpxHCxeP25CLVJtjzyfTZ4TMq5zunCXIxNK92D_-UCnMJCjISkoDWEv-RSyTSlfqqrp1JZ8kjnKIr3RJElrBNf-2mfEvdjmtsINsle-nEgD__nR8BGdvP-SotVcEuWZKWVvfyfAQ3BMhZeY2e_1z5hP-dpw0DkGs2vbYXF2mhE6oswU6d4GKATKTG");'></div>
<p class="text-[#111813] dark:text-white text-base font-normal leading-normal flex-1 truncate">Anna K.</p>
</div>
</div>
</div>
<!-- TitleText (Rating Section) -->
<h2 class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 text-left pb-2 pt-6">Overall Experience</h2>
<!-- Star Rating Component -->
<div class="px-4 py-2 flex items-center gap-1">
<button class="text-primary p-1">
<span class="material-symbols-outlined !text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="text-primary p-1">
<span class="material-symbols-outlined !text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="text-primary p-1">
<span class="material-symbols-outlined !text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="text-primary p-1">
<span class="material-symbols-outlined !text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="text-[#dbe6df] dark:text-gray-600 p-1">
<span class="material-symbols-outlined !text-4xl">star</span>
</button>
</div>
<!-- TextField -->
<div class="flex max-w-full flex-wrap items-end gap-4 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111813] dark:text-white text-base font-medium leading-normal pb-2">Share more details (optional)</p>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-[#111813] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe6df] dark:border-gray-700 bg-white dark:bg-background-dark focus:border-primary dark:focus:border-primary/80 min-h-36 placeholder:text-[#61896f] dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Add an optional comment..."></textarea>
</label>
</div>
<!-- ActionsBar (Submit & Skip Buttons) -->
<div class="flex flex-col sm:flex-row items-center gap-4 p-4 mt-4">
<button class="w-full sm:w-auto flex-1 sm:flex-none justify-center items-center gap-2 h-12 px-6 text-base font-bold text-black dark:text-black bg-primary rounded-lg transition-colors hover:bg-primary/90">
                           Submit Rating
                        </button>
<button class="w-full sm:w-auto justify-center items-center gap-2 h-12 px-6 text-base font-bold text-[#111813] dark:text-white bg-transparent rounded-lg transition-colors hover:bg-gray-200 dark:hover:bg-gray-700">
                           Maybe Later
                        </button>
</div>
</div>
</div>
</div>
</div>
</body></html>
