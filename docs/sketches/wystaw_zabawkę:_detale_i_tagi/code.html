<!DOCTYPE html>

<html class="light" lang="pl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Krok 2: Opisz swoją zabawkę</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#2bee6c",
            "background-light": "#f6f8f6",
            "background-dark": "#102216",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4 sm:p-6 md:p-8">
<div class="w-full max-w-3xl">
<!-- ProgressBar -->
<div class="mb-8">
<div class="flex gap-6 justify-between items-center mb-2">
<p class="text-slate-600 dark:text-slate-400 text-sm font-medium leading-normal">Krok 2 z 3</p>
</div>
<div class="rounded-full bg-slate-200 dark:bg-slate-700 h-2">
<div class="h-2 rounded-full bg-primary" style="width: 66%;"></div>
</div>
</div>
<!-- PageHeading -->
<div class="mb-10">
<h1 class="text-slate-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Opisz swoją zabawkę</h1>
</div>
<div class="flex flex-col gap-10">
<!-- Category Section -->
<div class="flex flex-col gap-2">
<h2 class="text-slate-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em]">Wybierz kategorię</h2>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal">Wybierz kategorię, która najlepiej pasuje do zabawki.</p>
<div class="mt-4">
<label class="sr-only" for="category-select">Kategoria</label>
<select class="form-select flex w-full max-w-md min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 px-4 py-3 text-base font-normal leading-normal" id="category-select">
<option disabled="" selected="">np. Klocki, Lalki, Gry planszowe</option>
<option value="klocki">Klocki</option>
<option value="lalki">Lalki i akcesoria</option>
<option value="gry">Gry planszowe</option>
<option value="pojazdy">Pojazdy</option>
<option value="edukacyjne">Edukacyjne</option>
</select>
</div>
</div>
<!-- Tags Section -->
<div class="flex flex-col gap-2">
<h2 class="text-slate-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em]">Dodaj tagi</h2>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal">Dodaj słowa kluczowe (tagi), aby inni mogli łatwiej znaleźć Twoją zabawkę (np. drewniana, interaktywna, dla 3-latka).</p>
<!-- Selected Tags Display -->
<div class="mt-4 flex min-h-[3.5rem] w-full flex-wrap items-center gap-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 p-2">
<span class="flex items-center gap-1.5 rounded-full bg-primary/20 px-3 py-1 text-sm font-medium text-slate-800 dark:text-slate-200">
              drewniana
              <button class="flex items-center justify-center">
<span class="material-symbols-outlined text-base">close</span>
</button>
</span>
<span class="flex items-center gap-1.5 rounded-full bg-primary/20 px-3 py-1 text-sm font-medium text-slate-800 dark:text-slate-200">
              dla 3-latka
              <button class="flex items-center justify-center">
<span class="material-symbols-outlined text-base">close</span>
</button>
</span>
<input class="min-w-[100px] flex-1 border-none bg-transparent p-1 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-0" placeholder="Wpisz tag..." type="text"/>
</div>
<!-- Suggested Tags -->
<div class="mt-4">
<h3 class="text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Sugerowane tagi</h3>
<div class="flex flex-wrap gap-2">
<button class="rounded-full border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark px-3 py-1.5 text-sm font-medium text-slate-700 dark:text-slate-300 transition-colors hover:bg-slate-200 dark:hover:bg-slate-700">edukacyjna</button>
<button class="rounded-full border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark px-3 py-1.5 text-sm font-medium text-slate-700 dark:text-slate-300 transition-colors hover:bg-slate-200 dark:hover:bg-slate-700">kreatywna</button>
<button class="rounded-full border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark px-3 py-1.5 text-sm font-medium text-slate-700 dark:text-slate-300 transition-colors hover:bg-slate-200 dark:hover:bg-slate-700">puzzle</button>
<button class="rounded-full border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark px-3 py-1.5 text-sm font-medium text-slate-700 dark:text-slate-300 transition-colors hover:bg-slate-200 dark:hover:bg-slate-700">montessori</button>
</div>
</div>
</div>
</div>
<!-- Navigation Buttons -->
<div class="mt-12 flex items-center justify-between border-t border-slate-200 dark:border-slate-800 pt-6">
<button class="inline-flex h-12 items-center justify-center rounded-lg bg-white dark:bg-slate-800 px-6 text-base font-medium text-slate-800 dark:text-slate-200 ring-1 ring-inset ring-slate-300 dark:ring-slate-700 transition-colors hover:bg-slate-100 dark:hover:bg-slate-700">
          Wstecz
        </button>
<button class="inline-flex h-12 items-center justify-center rounded-lg bg-primary px-6 text-base font-bold text-slate-900 transition-transform hover:scale-105 active:scale-95 disabled:cursor-not-allowed disabled:opacity-60">
          Dalej
        </button>
</div>
</div>
</div>
</body></html>
